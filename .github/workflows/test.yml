name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap gh curl
          # This disposable runner tests unprivileged namespaces directly.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Test gateway and real Linux boundary
        env:
          LEASE_REQUIRE_SANDBOX: '1'
        run: python3 -m unittest discover -v
      - name: Run offline demonstration
        run: python3 -m examples.demo
      - name: Check packaging and CLI
        run: |
          python3 -m venv /tmp/lease-package-test
          /tmp/lease-package-test/bin/pip install .
          /tmp/lease-package-test/bin/lease --help
          cd /tmp
          /tmp/lease-package-test/bin/lease demo

  permission-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikolalysenko/permission-matrix
          ref: c409db55a24dfab2d4908d9a96d07370e148c652
          path: permission-matrix
          persist-credentials: false
      - name: Install sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Exercise CLI, socket, MCP, and Linux boundaries
        run: python3 permission-matrix/adapters/agent_leases/main.py --repo . --output matrix-results
      - name: Summarize
        if: always()
        run: |
          if [ -f matrix-results/report.md ]; then
            cat matrix-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-matrix
          path: matrix-results
