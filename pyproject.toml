[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-leases"
version = "0.1.0"
description = "A small, counted GitHub capability gateway for sandboxed workers"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Mikola Lysenko"}]
dependencies = []

[project.scripts]
lease = "agent_leases.cli:main"

[tool.setuptools.packages.find]
include = ["agent_leases*"]
