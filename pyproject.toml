[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-leases"
version = "0.3.0"
description = "Run a command with a task budget, service adapters, and an isolated gateway"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Mikola Lysenko"}]
dependencies = []

[project.scripts]
lease = "agent_leases.cli:main"

[tool.setuptools.packages.find]
include = ["agent_leases*"]
