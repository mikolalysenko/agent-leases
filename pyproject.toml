[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-leases"
version = "0.2.0"
description = "Give an agent a GitHub task budget and keep its token outside the worker"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Mikola Lysenko"}]
dependencies = []

[project.scripts]
lease = "agent_leases.cli:main"

[tool.setuptools.packages.find]
include = ["agent_leases*"]
